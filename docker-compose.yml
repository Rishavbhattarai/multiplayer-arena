# One-command local stack: game server, static client, Prometheus, Grafana.
#   docker compose up -d --build --wait
# Host ports are configurable (defaults shown):
#   CLIENT_PORT=8081  client (nginx; also proxies /rooms and /ws to the server)
#   SERVER_PORT=8080  game server (HTTP lobby, /ws, /metrics, /stats)
#   PROMETHEUS_PORT=9090, GRAFANA_PORT=3000 (dashboard "Tanks Arena", anonymous viewer)
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8080"
      SERVER_ID: "server-1"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tanks.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
