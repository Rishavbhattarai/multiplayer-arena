<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks Arena</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="lobby">
      <h1>Tanks Arena</h1>
      <p class="sub">New rooms: <strong id="modeLabel">authoritative</strong> &middot; <a id="modeSwitch" href="#">switch</a></p>
      <label>Name <input id="name" maxlength="16" placeholder="tank" autocomplete="off" /></label>
      <div class="row">
        <button id="create">Create room</button>
      </div>
      <div class="row">
        <input id="roomCode" maxlength="6" placeholder="ROOM CODE" autocomplete="off" />
        <button id="join">Join</button>
      </div>
      <h2>Open rooms <button id="refresh" class="link">refresh</button></h2>
      <ul id="roomList"><li class="muted">loading...</li></ul>
      <p id="lobbyError" class="error" role="alert"></p>
      <p class="muted small">Server: <code id="serverLabel"></code></p>
    </main>

    <section id="game" hidden>
      <div id="hud"></div>
      <canvas id="canvas"></canvas>
      <div id="controls">
        <span class="muted small">W/S move &middot; A/D turn &middot; mouse aims &middot; click or Space fires</span>
        <fieldset id="netsim">
          <legend>Network simulator</legend>
          <label>lag (RTT ms) <input id="nsLag" type="number" min="0" max="2000" step="10" /></label>
          <label>jitter ms <input id="nsJitter" type="number" min="0" max="1000" step="5" /></label>
          <label>loss % <input id="nsLoss" type="number" min="0" max="50" step="1" /></label>
          <label>loss model
            <select id="nsModel"><option value="tcp">tcp (retransmit)</option><option value="drop">drop</option></select>
          </label>
          <button id="nsPreset" class="secondary" title="150 ms RTT, 20 ms jitter, 5% loss">150 ms / 5%</button>
          <button id="nsOff" class="secondary">off</button>
        </fieldset>
        <button id="dropConn" class="secondary" title="Close the socket and resume with the reconnect token">Drop connection</button>
        <button id="leave" class="secondary">Leave</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
